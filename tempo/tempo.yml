server:
  http_listen_port: 3200

distributor:
  log_received_spans:
    enabled: true
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

# Metrics generator for TraceQL metrics queries
metrics_generator:
  ring:
    instance_addr: 127.0.0.1
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      dimensions: []
  registry:
    external_labels:
      source: tempo
      cluster: railway
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus.railway.internal:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
